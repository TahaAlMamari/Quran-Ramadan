    <line x1="-112" y1="-2" x2="-32" y2="-2" opacity="0.5" stroke-width="5"/>
    <line x1="-115" y1="24" x2="-28" y2="24" opacity="0.5" stroke-width="5"/>
    <!-- Page lines right -->
