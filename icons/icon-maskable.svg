    <line x1="-92" y1="-24" x2="-34" y2="-24" opacity="0.5" stroke-width="5"/>
    <line x1="-96" y1="-2" x2="-28" y2="-2" opacity="0.5" stroke-width="5"/>
    <line x1="-98" y1="20" x2="-24" y2="20" opacity="0.5" stroke-width="5"/>
    <line x1="92" y1="-24" x2="34" y2="-24" opacity="0.5" stroke-width="5"/>
    <line x1="96" y1="-2" x2="28" y2="-2" opacity="0.5" stroke-width="5"/>
    <line x1="98" y1="20" x2="24" y2="20" opacity="0.5" stroke-width="5"/>
  </g>
  <!-- Crescent -->
  <path d="M290,105 A32,32 0 1,0 290,165 A24,24 0 1,1 290,105" fill="url(#gold)" opacity="0.9"/>
