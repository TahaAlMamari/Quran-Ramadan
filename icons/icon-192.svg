<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6b3f"/>
      <stop offset="100%" stop-color="#0a5632"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#c8a84e"/>
      <stop offset="100%" stop-color="#f0d060"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>
  <!-- Open book -->
  <g transform="translate(96,100)" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,-30 C0,-30 -40,-35 -50,-20 L-50,30 C-40,18 0,22 0,22"/>
    <path d="M0,-30 C0,-30 40,-35 50,-20 L50,30 C40,18 0,22 0,22"/>
    <!-- Page lines left -->
    <line x1="-40" y1="-10" x2="-15" y2="-10" opacity="0.5" stroke-width="2"/>
    <line x1="-42" y1="0" x2="-12" y2="0" opacity="0.5" stroke-width="2"/>
    <line x1="-43" y1="10" x2="-10" y2="10" opacity="0.5" stroke-width="2"/>
    <!-- Page lines right -->
    <line x1="40" y1="-10" x2="15" y2="-10" opacity="0.5" stroke-width="2"/>
    <line x1="42" y1="0" x2="12" y2="0" opacity="0.5" stroke-width="2"/>
    <line x1="43" y1="10" x2="10" y2="10" opacity="0.5" stroke-width="2"/>
  </g>
  <!-- Crescent -->
  <path d="M112,38 A14,14 0 1,0 112,62 A10,10 0 1,1 112,38" fill="url(#gold)" opacity="0.9"/>
  <!-- Star -->
  <polygon points="130,42 132,48 138,48 133,52 135,58 130,54 125,58 127,52 122,48 128,48" fill="url(#gold)" opacity="0.8"/>
</svg>
